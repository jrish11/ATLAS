<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATLAS Remote</title><style>body{font:16px -apple-system,sans-serif;background:#17191d;color:#f4f4f4;margin:0;padding:24px}main{max-width:560px;margin:auto}textarea,input{box-sizing:border-box;width:100%;background:#282c32;color:white;border:1px solid #626a76;border-radius:12px;padding:12px;font:inherit}textarea{min-height:120px}button{font:inherit;border-radius:9px;padding:10px 16px;margin:8px 6px 8px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#282c32;padding:12px;border-radius:10px}</style></head><body><main>
<h1>ATLAS Remote</h1><p id="state" role="status">Enter a device name and request pairing. The Mac owner must approve.</p>
<div id="pair"><label for="device">This device’s name</label><input id="device" maxlength="80"><button id="connect">Request pairing</button></div>
<div id="taskArea" hidden><label for="task">What should ATLAS do?</label><p>Type or use the iPhone keyboard’s dictation, then review before sending.</p><textarea id="task" maxlength="4000"></textarea><button id="review">Review</button><pre id="preview"></pre><button id="send" disabled>Send</button><button id="stop" disabled>Stop</button></div>
<script>
'use strict';let code=location.hash.slice(1),token='',csrf='',active=null,stopping=false,reviewed='';history.replaceState(null,'',location.pathname);const $=x=>document.getElementById(x),state=x=>$('state').textContent=x;
async function call(path,body,paired=true){let headers={'Content-Type':'application/json'};if(paired){headers['X-Atlas-Token']=token;headers['X-Atlas-CSRF']=csrf}let r=await fetch(path,{method:'POST',headers,body:JSON.stringify(body),cache:'no-store',credentials:'omit',redirect:'error'});if(!r.ok)throw Error('rejected');return r.json()}
$('connect').onclick=async()=>{try{$('connect').disabled=true;state('Waiting for approval on the Mac…');let r=await call('/pair',{code,device:$('device').value},false);code='';token=r.token;csrf=r.csrf;$('pair').hidden=true;$('taskArea').hidden=false;state('Connected for this session.')}catch(e){code='';state('Pairing was denied, expired, or unavailable. Request a new invitation.')}};
$('review').onclick=()=>{if(active)return;reviewed=$('task').value.trim();$('preview').textContent=reviewed;$('send').disabled=!reviewed};$('task').oninput=()=>{$('send').disabled=true;reviewed=''};
$('send').onclick=async()=>{if(active||!reviewed)return;const current=Object.freeze({id:crypto.randomUUID().replaceAll('-',''),task:reviewed});active=current;stopping=false;$('send').disabled=true;$('review').disabled=true;$('task').disabled=true;$('stop').disabled=false;state('Waiting for approval on the Mac…');try{let r=await call('/task',{id:current.id,task:current.task});if(active!==current||stopping)return;state(r.status);if(!['cancelled','failed','unknown'].includes(r.status))poll(current);else $('stop').disabled=true}catch(e){if(active===current&&!stopping){$('stop').disabled=true;state('Connection lost. The task outcome may be unknown; ask the Mac owner to review it.')}}};
async function poll(current){if(active!==current||stopping)return;try{let r=await call('/status',{id:current.id});if(active!==current||stopping)return;state(r.status);if(['queued','running','needs-owner','submitted','cancelling'].includes(r.status))setTimeout(()=>poll(current),2000);else $('stop').disabled=true}catch(e){if(active===current&&!stopping){$('stop').disabled=true;state('Connection lost. Ask the Mac owner to review the task.')}}}
$('stop').onclick=async()=>{const current=active;if(!current||stopping)return;stopping=true;$('stop').disabled=true;try{let r=await call('/stop',{id:current.id});if(active===current)state(r.status+' — an action already dispatched may have taken effect.')}catch(e){if(active===current)state('Connection lost. Ask the Mac owner to review the task.')}};
</script></main></body></html>
