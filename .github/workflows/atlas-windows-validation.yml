# Copy this file to the public repository's .github/workflows/ and the reviewed
# Windows source to platforms/windows/. Manual dispatch only: publishing does not run CI.
name: ATLAS Windows validation
"on":
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-validation:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: platforms/windows
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Initialize isolated test profile
        run: |
          $profile = Join-Path $env:RUNNER_TEMP 'atlas-test-state'
          New-Item -ItemType Directory -Force $profile | Out-Null
          "ATTICUS_DIR=$profile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Windows and isolated Codex regression tests
        run: |
          foreach ($pattern in @('test_atticus.py', 'test_learning.py', 'test_javascript.py', 'test_codex_account.py', 'test_atlas_codex_task.py')) {
            python -m unittest discover -s tests -p $pattern -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python atticus.py --selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish development build
        run: |
          dotnet publish win/Atticus -c Release -r win-x64 --self-contained -p:DebugType=none -o "$env:RUNNER_TEMP\atlas-build" --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run native self-test
        run: |
          $app = Join-Path $env:RUNNER_TEMP 'atlas-build\Atticus.exe'
          $result = Start-Process -FilePath $app -ArgumentList '--selftest' -PassThru -Wait
          if ($result.ExitCode -ne 0) { throw "Native self-test failed: $($result.ExitCode)" }
      - name: Check development build script syntax
        run: |
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'build-atlas.ps1'), [ref]$null, [ref]$errors)
          if ($errors) { $errors; exit 1 }

      - name: Retain successful build output for inspection only
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, official tag verified
        with:
          name: ATLAS-Windows-x64-CI-REVIEW-${{ github.sha }}
          path: ${{ runner.temp }}\atlas-build
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: false
